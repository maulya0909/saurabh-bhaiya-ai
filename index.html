
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saurabh Bhaiya AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b12;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;text-align:center;
 background:#0b1724;border-bottom:1px solid #00eaff;
}
header h2{color:#00eaff;margin:0}
header p{color:#9bb5c5;font-size:13px}
.container{max-width:650px;margin:auto;padding:16px}
.status{text-align:center;color:#00eaff;margin:15px}
.orb{
 width:130px;height:130px;border:2px solid #00eaff;
 border-radius:50%;margin:20px auto;
 display:flex;align-items:center;justify-content:center;
 font-size:45px;box-shadow:0 0 30px #00eaff55;
}
.orb.active{animation:pulse 1s infinite}
@keyframes pulse{
 50%{box-shadow:0 0 45px #00eaff}
}
.chat{
 height:340px;overflow-y:auto;
 background:#0b1724;border:1px solid #183c50;
 border-radius:15px;padding:12px;
}
.msg{padding:11px;margin:9px 0;border-radius:12px;
 line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#123e54;text-align:right}
.bot{background:#172635}
.controls{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;min-width:0;padding:14px;
 border-radius:10px;border:1px solid #17667a;
 background:#10202d;color:white;font-size:16px;
}
button{
 border:0;border-radius:10px;padding:13px;
 background:#00d9e9;color:#001018;
 font-weight:bold;cursor:pointer;
}
.mic{
 display:block;margin:15px auto;
 width:75px;height:75px;border-radius:50%;
 font-size:27px;
}
button:disabled{opacity:.5}
.footer{text-align:center;color:#7994a5;font-size:12px;margin:20px}
</style>
</head>

<body>
<header>
<h2>SAURABH BHAIYA AI</h2>
<p>Your Smart Marathi Voice Assistant</p>
</header>

<div class="container">
<div class="status" id="status">ऑनलाइन होण्यासाठी तयार</div>

<div class="orb" id="orb">🤖</div>

<div class="chat" id="chat">
<div class="msg bot">नमस्कार! मी सौरभ भैया AI आहे. मला मराठीत प्रश्न विचारा.</div>
</div>

<button class="mic" id="mic" onclick="listen()">🎙️</button>

<div class="controls">
<input id="message" placeholder="इथे प्रश्न लिहा..." autocomplete="off">
<button id="send" onclick="sendMessage()">पाठवा</button>
</div>

<div class="footer">SAURABH BHAIYA AI • Smart Assistant</div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const orb = document.getElementById("orb");
const sendButton = document.getElementById("send");

let history = [];
let busy = false;

function addMessage(text, type){
 const item = document.createElement("div");
 item.className = "msg " + type;
 item.textContent = text;
 chat.appendChild(item);
 chat.scrollTop = chat.scrollHeight;
}

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const voice = new SpeechSynthesisUtterance(text);
 voice.lang = "mr-IN";
 voice.rate = 1;
 speechSynthesis.speak(voice);
}

async function sendMessage(){
 const question = input.value.trim();

 if(!question || busy) return;

 busy = true;
 sendButton.disabled = true;
 input.value = "";

 addMessage(question,"user");
 statusText.textContent = "उत्तर तयार होत आहे...";

 history.push({role:"user",content:question});

 try{
  const response = await fetch("/.netlify/functions/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:history.slice(-16)})
  });

  if(!response.ok) throw new Error("AI service unavailable");

  const data = await response.json();
  const answer = data.reply;

  if(!answer) throw new Error("उत्तर मिळाले नाही");

  history.push({role:"assistant",content:answer});
  addMessage(answer,"bot");
  statusText.textContent = "सौरभ भैया तयार आहे";
  speak(answer);

 }catch(error){
  history.pop();
  addMessage("AI शी संपर्क होत नाही. इंटरनेट किंवा सर्व्हर तपासा.","bot");
  statusText.textContent = "कनेक्शन तपासण्याची गरज आहे";
 }finally{
  busy = false;
  sendButton.disabled = false;
 }
}

input.addEventListener("keydown",function(event){
 if(event.key === "Enter") sendMessage();
});

function listen(){
 const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  statusText.textContent = "या ब्राउजरमध्ये Voice Recognition उपलब्ध नाही";
  return;
 }

 const recognition = new SpeechRecognition();
 recognition.lang = "mr-IN";
 recognition.interimResults = false;

 recognition.onstart = function(){
  statusText.textContent = "ऐकत आहे...";
  orb.classList.add("active");
 };

 recognition.onresult = function(event){
  input.value = event.results[0][0].transcript;
  sendMessage();
 };

 recognition.onerror = function(){
  statusText.textContent = "पुन्हा प्रयत्न करा";
 };

 recognition.onend = function(){
  orb.classList.remove("active");
 };

 recognition.start();
}
</script>
</body>
</html>
